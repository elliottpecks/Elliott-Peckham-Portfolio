<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Elliott Peckham</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Contact Page Layout */
    .contact-container {
      max-width: 800px;
      margin: 60px auto;
      text-align: center;
      width: 100%;
    }

    .bio-text {
      font-size: 1.1rem;
      font-weight: 300;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 40px;
      color: #333333;
      line-height: 1.6;
    }

    .contact-card {
      background: #fdfdfd;
      border: 1px solid #eeeeee;
      padding: 40px 20px;
      margin-top: 20px;
    }

    .email-link {
      display: inline-block;
      font-size: 1.2rem;
      font-weight: 300;
      letter-spacing: 3px;
      color: #000000;
      text-decoration: none;
      margin-bottom: 30px;
      transition: opacity 0.2s ease;
    }

    .email-link:hover {
      opacity: 0.6;
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-top: 10px;
    }

    .social-links a {
      text-decoration: none;
      color: #000000;
      font-size: 0.85rem;
      font-weight: 300;
      letter-spacing: 3px;
      text-transform: uppercase;
      transition: transform 0.2s ease;
      display: inline-block;
    }

    .social-links a:hover {
      transform: scale(1.08);
      font-weight: 500;
    }
  </style>
</head>
<body>

<header class="site-header">

    <nav class="main-nav">

      <a href="design.html">Graphic Design</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main class="contact-container">
    <p class="bio-text">Sports Photographer Based in the Twin Cities area.</p>

    <div class="contact-card">
      <a href="mailto:peckhamelliott@gmail.com" class="email-link">peckhamelliott@gmail.com</a>
      
      <div class="social-links">
        <a href="https://www.instagram.com/ep_does_visuals/?hl=en" target="_blank" rel="noopener">Instagram</a>
        <a href="https://www.linkedin.com/in/elliott-peckham-767b37350" target="_blank" rel="noopener">LinkedIn</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <p>All images © Elliott Peckham</p>
  </footer>

</body>
