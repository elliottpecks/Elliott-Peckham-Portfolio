  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Contact Page Layout */
    .contact-container {
      max-width: 800px;
      margin: 60px auto;
      text-align: center;
      width: 100%;
    }

    .bio-text {
      font-size: 1.1rem;
      font-weight: 300;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 40px;
      color: #333333;
      line-height: 1.6;
    }

    .contact-card {
      background: #fdfdfd;
      border: 1px solid #eeeeee;
      padding: 40px 20px;
      margin-top: 20px;
    }

    .email-link {
      display: inline-block;
      font-size: 1.2rem;
      font-weight: 300;
      letter-spacing: 3px;
      color: #000000;
      text-decoration: none;
      margin-bottom: 30px;
      transition: opacity 0.2s ease;
    }

    .email-link:hover {
      opacity: 0.6;
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-top: 10px;
    }

    .social-links a {
      text-decoration: none;
      color: #000000;
      font-size: 0.85rem;
      font-weight: 300;
      letter-spacing: 3px;
      text-transform: uppercase;
      transition: transform 0.2s ease;
      display: inline-block;
    }

    .social-links a:hover {
      transform: scale(1.08);
      font-weight: 500;
    }
  </style>
</head>
